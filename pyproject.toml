[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "0.1.0"
description = "End-to-end credit card fraud detection with MLOps."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pyarrow>=15",
    "xgboost>=2.1",
    "mlflow>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.40",
    "httpx>=0.27",
    "shap>=0.46",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
kaggle = ["kaggle>=1.6"]

[project.scripts]
fraud-detection = "fraud_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need the real Kaggle dataset in data/raw (skipped if absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
# Allow the ML convention of capital `X` for feature matrices.
ignore = ["N803", "N806"]
